syntax = "proto3";

package muxcore.automation.v1;

option go_package = "github.com/Muxcore-Media/contracts-automation/muxcore/automation/v1;automationv1";

service AutomationService {
  rpc SearchItem(SearchItemRequest) returns (SearchItemResponse);
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  rpc AddToQueue(AddToQueueRequest) returns (AddToQueueResponse);
  rpc GetQueue(GetQueueRequest) returns (GetQueueResponse);
  rpc UpdateQueueItem(UpdateQueueItemRequest) returns (UpdateQueueItemResponse);
  rpc RemoveFromQueue(RemoveFromQueueRequest) returns (RemoveFromQueueResponse);
  rpc SetMonitored(SetMonitoredRequest) returns (SetMonitoredResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc SearchNow(SearchNowRequest) returns (SearchNowResponse);
  rpc ListBlocklist(ListBlocklistRequest) returns (ListBlocklistResponse);
  rpc ClearBlocklist(ClearBlocklistRequest) returns (ClearBlocklistResponse);
  rpc BlocklistRelease(BlocklistReleaseRequest) returns (BlocklistReleaseResponse);
  rpc RetryImport(RetryImportRequest) returns (RetryImportResponse);
  rpc ListDelayProfiles(ListDelayProfilesRequest) returns (ListDelayProfilesResponse);
  rpc UpsertDelayProfile(UpsertDelayProfileRequest) returns (UpsertDelayProfileResponse);
  rpc ListCutoffUnmet(ListCutoffUnmetRequest) returns (ListCutoffUnmetResponse);
  rpc ListSeriesOverrides(ListSeriesOverridesRequest) returns (ListSeriesOverridesResponse);
  rpc UpsertSeriesOverride(UpsertSeriesOverrideRequest) returns (UpsertSeriesOverrideResponse);
  rpc DeleteSeriesOverride(DeleteSeriesOverrideRequest) returns (DeleteSeriesOverrideResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message SearchItemRequest {
  string item_type = 1;   // movie|tv|music|book|comic|audiobook
  string query = 2;
  int32 tmdb_id = 3;
  int32 year = 4;
  int32 season = 5;
  int32 episode = 6;
  int32 limit = 7;
  string quality_profile_id = 8;
  int32 absolute = 9;       // anime absolute episode number
  string series_type = 10;  // "standard", "daily", or "anime"
}

message SearchItemResponse {
  repeated ReleaseMatch matches = 1;
}

message ReleaseMatch {
  string guid = 1;
  string title = 2;
  int64 size = 3;
  int32 seeders = 4;
  int32 peers = 5;
  string indexer_name = 6;
  string download_url = 7;
  string info_url = 8;
  string download_protocol = 9;
  int32 score = 10;
  string category = 11;
  string sub_category = 12;
  bool rejected = 13;              // true when the release failed quality/title/cutoff checks
  string rejection_reason = 14;      // human-readable reason when rejected=true
  int32 format_score = 15;           // optional custom-format score component
}

message DispatchRequest {
  string guid = 1;
  string title = 2;
  string download_url = 3;
  string download_protocol = 4;
  int64 size = 5;
  int32 score = 6;
  string indexer_name = 7;
  string item_type = 8;
  string item_id = 9;
  int32 tmdb_id = 10;
}

message DispatchResponse {
  string download_id = 1;
  string status = 2;
}

message AddToQueueRequest {
  string item_type = 1;   // movie|tv|music|book|comic|audiobook
  string item_id = 2;
  int32 tmdb_id = 3;
  string title = 4;
  int32 year = 5;
  int32 season_number = 6;
  int32 episode_number = 7;
  string quality_profile_id = 8;
  int32 absolute_number = 9;  // anime absolute episode number
  string series_type = 10;    // "standard", "daily", or "anime"
  string series_id = 11;      // library series id (for overrides / grouping)
  bool monitored = 12;          // optional; defaults to true when unset
}

message AddToQueueResponse {
  string queue_id = 1;
}

message GetQueueRequest {
  int32 page = 1;
  int32 page_size = 2;
  string filter = 3;              // optional item_type filter: movie|tv|music|book|comic|audiobook
  optional bool missing = 4;        // when set, filter by missing file on disk
  optional bool monitored = 5;    // when set, filter by monitored flag
}

message GetQueueResponse {
  repeated QueueItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message QueueItem {
  string id = 1;
  string item_type = 2;
  string item_id = 3;
  int32 tmdb_id = 4;
  string title = 5;
  int32 year = 6;
  int32 season_number = 7;
  int32 episode_number = 8;
  bool monitored = 9;
  bool missing = 10;
  string last_searched = 11;
  string created_at = 12;
  string updated_at = 13;
  string quality_profile_id = 14;
  string series_id = 15;          // library series id (TV grouping / overrides)
  int32 absolute_number = 16;     // anime absolute episode number
  string series_type = 17;        // "standard", "daily", or "anime"
}

message UpdateQueueItemRequest {
  string queue_id = 1;
  optional bool monitored = 2;
  string quality_profile_id = 3;  // empty = leave unchanged
}

message UpdateQueueItemResponse {
  QueueItem item = 1;
}

message GetHistoryRequest {
  int32 page = 1;
  int32 page_size = 2;
  string status = 3;          // optional: filter by status (e.g. import_failed, stalled)
  string wanted_item_id = 4;  // optional: filter by wanted queue item
}

message GetHistoryResponse {
  repeated DownloadRecord records = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message SearchNowRequest {
  string queue_id = 1;    // optional: search one queue item by id
  string item_type = 2;   // optional with item_id: movie|tv|music|book|comic|audiobook
  string item_id = 3;     // optional with item_type: library item id
}

message SearchNowResponse {
  bool started = 1;
  string message = 2;
}

message DownloadRecord {
  string id = 1;
  string wanted_item_id = 2;
  string guid = 3;
  string title = 4;
  string indexer = 5;
  int64 size = 6;
  int32 score = 7;
  string download_url = 8;
  string download_protocol = 9;
  string status = 10;
  string sent_at = 11;
  string completed_at = 12;
  string created_at = 13;
  string download_id = 14;
  string status_detail = 15; // operator-facing reason when status is failed/stalled/import_failed
  string status_label = 16; // human-readable label derived from status + status_detail
}

message RemoveFromQueueRequest {
  string queue_id = 1;
}

message RemoveFromQueueResponse {}

message SetMonitoredRequest {
  string queue_id = 1;
  bool monitored = 2;
}

message SetMonitoredResponse {
  QueueItem item = 1;
}

message ListBlocklistRequest {
  int32 page = 1;
  int32 page_size = 2;
  string wanted_item_id = 3;
}

message BlocklistEntry {
  string wanted_item_id = 1;
  string guid = 2;
  int32 loop = 3;
  string reason = 4;
  string created_at = 5;
  string title = 6;
}

message ListBlocklistResponse {
  repeated BlocklistEntry entries = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ClearBlocklistRequest {
  string wanted_item_id = 1; // optional: clear one item's entries
  string guid = 2;           // optional with wanted_item_id
  bool clear_all = 3;
}

message ClearBlocklistResponse {
  int32 removed = 1;
}

message ListDelayProfilesRequest {}

message DelayProfile {
  string protocol = 1;
  int32 wait_minutes = 2;
}

message ListDelayProfilesResponse {
  repeated DelayProfile profiles = 1;
}

message UpsertDelayProfileRequest {
  string protocol = 1;
  int32 wait_minutes = 2;
}

message UpsertDelayProfileResponse {
  DelayProfile profile = 1;
}

message ListCutoffUnmetRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message CutoffItem {
  string queue_id = 1;
  string item_type = 2;
  string item_id = 3;
  string title = 4;
  int32 year = 5;
  int32 current_score = 6;
  int32 cutoff_score = 7;
  string quality_profile_id = 8;
}

message ListCutoffUnmetResponse {
  repeated CutoffItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message BlocklistReleaseRequest {
  string wanted_item_id = 1;
  string guid = 2;
  string reason = 3;
  int32 loop = 4; // optional; defaults to 1
}

message BlocklistReleaseResponse {
  bool success = 1;
}

message RetryImportRequest {
  string history_id = 1; // optional; empty = retry all import_failed
}

message RetryImportResponse {
  int32 attempted = 1;
  string message = 2;
}

message SeriesOverride {
  string series_id = 1;
  int32 delay_minutes = 2;
  repeated string preferred_groups = 3;
  repeated string ignored_groups = 4;
}

message ListSeriesOverridesRequest {}

message ListSeriesOverridesResponse {
  repeated SeriesOverride overrides = 1;
}

message UpsertSeriesOverrideRequest {
  SeriesOverride override = 1;
}

message UpsertSeriesOverrideResponse {
  SeriesOverride override = 1;
}

message DeleteSeriesOverrideRequest {
  string series_id = 1;
}

message DeleteSeriesOverrideResponse {}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  repeated string supported_item_types = 1;  // e.g. movie, tv, music, book, comic, audiobook
  bool supports_delay_profiles = 2;
  bool supports_cutoff = 3;
  bool supports_blocklist = 4;
  bool supports_anime_absolute = 5;
  repeated string supported_protocols = 6;   // e.g. torrent, usenet
}
